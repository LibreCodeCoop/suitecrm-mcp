# Internal-only MCP and token exchange. Never publish this listener to the internet.
server {
    listen 8080;
    server_name _;
    root /app/public;
    server_tokens off;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store" always;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"alive"}';
    }

    location = /.well-known/oauth-protected-resource {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    }
    location = /.well-known/oauth-protected-resource/mcp {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    }

    # The tunnel reads local auth metadata and auto-registers the token endpoint.
    # Internal metadata discovery for the configured issuer; never expose this listener.
    location ~ ^/\.well-known/oauth-authorization-server/[a-z0-9-]+$ {
        limit_except GET { deny all; }
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /app/public/oauth.php;
    }

    # Harpoon OAuth shim registers this loopback URL; never an edge route.
    location = /oauth/token {
        access_log off;
        limit_except POST { deny all; }
        client_max_body_size 8k;
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /app/public/oauth.php;
    }

    location = /mcp {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_param HTTP_MCP_PROTOCOL_VERSION $http_mcp_protocol_version;
        fastcgi_param HTTP_MCP_SESSION_ID $http_mcp_session_id;
        fastcgi_param HTTP_MCP_METHOD $http_mcp_method;
        fastcgi_param HTTP_MCP_NAME $http_mcp_name;
        fastcgi_read_timeout 90s;
        fastcgi_buffering off;
    }

    location / { return 404; }
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}
