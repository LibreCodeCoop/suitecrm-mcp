# Narrow public OAuth browser entrypoint; expose through the configured HTTPS issuer only.
# No MCP endpoint, no token endpoint, no access log containing authorization codes.
limit_req_zone $binary_remote_addr zone=oauth_browser:10m rate=5r/s;

server {
    listen 8081;
    server_name _;
    root /app/public;
    server_tokens off;
    access_log off;
    client_max_body_size 8k;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options nosniff always;


    location ~ ^/\.well-known/oauth-authorization-server/[a-z0-9-]+$ {
        limit_except GET { deny all; }
        limit_req zone=oauth_browser burst=10 nodelay;
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /app/public/oauth.php;
    }

    location ~ ^/[a-z0-9-]+/authorize$ {
        limit_except GET { deny all; }
        limit_req zone=oauth_browser burst=10 nodelay;
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /app/public/oauth.php;
    }

    location ~ ^/[a-z0-9-]+/callback$ {
        limit_except GET { deny all; }
        limit_req zone=oauth_browser burst=10 nodelay;
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /app/public/oauth.php;
    }

    # OAuth code exchange: public HTTPS POST only, PKCE and client/audience checked in PHP.
    # This is NOT the MCP API. Never forward /mcp or generic /oauth/token.
    location ~ ^/[a-z0-9-]+/token$ {
        access_log off;
        limit_except POST { deny all; }
        limit_req zone=oauth_browser burst=10 nodelay;
        client_max_body_size 8k;
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /app/public/oauth.php;
    }

    # Exact private token route must never match the generic issuer regex.
    location = /oauth/token { return 404; }

    location / { return 404; }
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}
