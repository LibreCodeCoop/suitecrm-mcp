version: 2
updates:
  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      php-dependencies:
        patterns: ["*"]
  # Dockerfile and Compose updates belong exclusively to Renovate.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      ci-actions:
        patterns: ["*"]

  - package-ecosystem: composer
    directory: /vendor-bin/phpunit
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: composer
    directory: /vendor-bin/phpstan
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: composer
    directory: /vendor-bin/php-cs-fixer
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
