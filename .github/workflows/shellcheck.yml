name: ShellCheck
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: shellcheck-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shellcheck:
    name: Check remaining Git and Docker shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck --severity=warning tools/check-commits.sh tests/integration/docker-smoke.sh
