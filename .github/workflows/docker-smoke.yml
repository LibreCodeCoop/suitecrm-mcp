name: Docker Smoke
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: docker-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    name: Offline synthetic MCP and OAuth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Compose syntax
        env:
          SUITECRM_AUTH_CLIENT_ID: example-only
          OPENAI_TUNNEL_ID: tunnel_0123456789abcdef0123456789abcdef
          MCP_RESOURCE_URI: https://api.openai.com/v1/mcp/tunnel_0123456789abcdef0123456789abcdef
        run: docker compose --env-file .env.deploy.example config --quiet
      - name: Build image
        run: docker build --pull -t suitecrm-mcp:ci .
      - name: Smoke private MCP and narrow OAuth edge
        run: bash tests/integration/docker-smoke.sh
