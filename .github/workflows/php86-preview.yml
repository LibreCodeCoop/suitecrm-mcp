name: PHP 8.6 Preview
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: php86-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  php86:
    name: PHP 8.6 RC compatibility (experimental)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.5'
          extensions: mbstring, curl, openssl, pdo_sqlite, sodium, fileinfo
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer bin phpunit install --no-interaction --prefer-dist --no-progress
      - name: Build PHP 8.6 RC runtime without deploying it
        # The production FROM is intentionally literal so Dependabot detects the
        # stable PHP tag and its digest. Substitute only in this preview build.
        run: |
          grep -Eq '^FROM php:[0-9]+[.][0-9]+[.][0-9]+-fpm-alpine[0-9]+[.][0-9]+@sha256:[a-f0-9]{64}$' Dockerfile
          sed -E 's|^FROM php:[^ ]+@sha256:[a-f0-9]{64}$|FROM php:8.6.0RC4-fpm-alpine3.24@sha256:749a9004d24018d05935240035d545a795047ffa751859fae42eb7062e331c22|' Dockerfile | \
            docker build --file - --tag suitecrm-mcp:php86-preview .
      - name: Test application on PHP 8.6 RC
        run: |
          docker run --rm --network none -v "$PWD:/app:ro" -w /app \
            --entrypoint php suitecrm-mcp:php86-preview \
            vendor-bin/phpunit/vendor/bin/phpunit -c phpunit.xml.dist \
            --no-progress --do-not-record-test-run-history
